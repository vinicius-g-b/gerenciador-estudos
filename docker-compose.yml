version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres_estudos
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: 123
      POSTGRES_DB: gerenciador_bd
    ports:
    - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: